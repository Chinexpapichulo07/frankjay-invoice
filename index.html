<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankjay Ventures E-Invoice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* RESTORED BLUE THEME COLOR */
        :root { --theme-color: #003366; } 
        
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        
        /* Dashboard Controls */
        .controls { 
            max-width: 794px; margin: 0 auto 20px auto; background: #fff; 
            padding: 15px; border-radius: 8px; display: flex; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button { 
            padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; 
            font-weight: bold; font-size: 14px; 
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-download { background-color: var(--theme-color); color: white; }

        /* INVOICE PAPER */
        #invoice-card { 
            background: white; 
            width: 794px; /* A4 Width */
            min-height: 1123px; /* A4 Height */
            margin: 0 auto; 
            padding: 40px; /* Reduced padding slightly to fit everything */
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            color: var(--theme-color); /* TEXT IS BLUE AGAIN */
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--theme-color); padding-bottom: 10px; margin-bottom: 20px;}
        .logo-placeholder-img { max-width: 300px; max-height: 100px; display: block; }
        .address-area { text-align: right; font-size: 13px; line-height: 1.4; color: black; }
        
        /* Meta Info */
        .meta-info { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;}
        .input-group { font-size: 16px; font-weight: bold; display: flex; align-items: center; flex-grow: 1; margin-right: 20px; color: black;}
        .input-underline { border-bottom: 1px solid var(--theme-color); flex-grow: 1; margin-left: 10px; }
        .input-group input { border: none; width: 100%; outline: none; font-size: 16px; font-family: inherit; padding: 5px; font-weight: bold; color: black;}

        /* TABLE STYLING */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }
        
        /* COLUMN WIDTHS */
        .col-sn { width: 50px; text-align: left; padding-left: 10px; }
        .col-desc { } 
        .col-amt { width: 180px; text-align: left; } 
        .col-del { width: 30px; border: none !important; }

        th { 
            background-color: #eef6fc; /* Light Blue BG */
            border: 1px solid var(--theme-color); /* Blue Border */
            color: var(--theme-color);
            padding: 12px; 
            text-align: left; 
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        td { 
            border: 1px solid var(--theme-color); /* Blue Border */
            padding: 12px; 
            vertical-align: middle; 
            font-size: 15px;
            color: black;
        }

        /* INPUTS INSIDE TABLE */
        input.cell-input { width: 100%; border: none; outline: none; font-size: 15px; background: transparent; }

        /* === TOTAL ROW (FIXED) === */
        /* Now has borders and sits inside the column */
        tfoot tr td {
            border: 1px solid var(--theme-color) !important; /* Forces border to show */
            background-color: #eef6fc; /* Light blue background for emphasis */
            padding-top: 15px;
            padding-bottom: 15px;
            color: var(--theme-color);
        }

        /* Remove border for the empty delete column only */
        tfoot tr td:last-child { border: none !important; background: transparent; }

        .total-label { 
            text-align: right; 
            font-weight: 900; 
            font-size: 20px; 
            padding-right: 15px;
        }
        
        .total-value { 
            text-align: left; 
            font-weight: 900; 
            font-size: 20px; 
            padding-left: 12px;
        }

        /* Footer Note & Signature */
        .footer-note { 
            margin-top: 30px; /* Reduced gap (was 80px) */
            font-size: 13px; 
            font-style: italic; 
            color: black; 
        }
        
        .signature-line {
            margin-top: 50px;
            border-top: 2px solid var(--theme-color);
            width: 250px;
            text-align: center;
            padding-top: 5px;
            font-style: normal;
            font-weight: bold;
            color: var(--theme-color);
        }

        .delete-btn { color: red; cursor: pointer; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-add" onclick="addRow()">+ Add Item</button>
        <button class="btn-download" onclick="generatePDF()">Download PDF</button>
    </div>

    <div id="invoice-card">
        <div class="header">
            <div class="logo-area">
                <img src="frankjayv-logo.png" alt="Frankjay Ventures" class="logo-placeholder-img" onerror="this.style.display='none'">
            </div>
            <div class="address-area">
                9, Adepele Street, Off Simbiat Abiola Way,<br>
                Ikeja, Lagos.<br>
                Tel: 080-2314-3506, 070-5512-0916<br>
                Email: frankjayventures@yahoo.com
            </div>
        </div>

        <div class="meta-info">
            <div class="input-group">
                M: <div class="input-underline"><input type="text" id="customerName" placeholder="Gems Consulting Company"></div>
            </div>
            <div class="input-group" style="flex-grow: 0;">
                Date: <div class="input-underline"><input type="date" id="invDate"></div>
            </div>
        </div>

        <table id="itemsTable">
            <thead>
                <tr>
                    <th class="col-sn">S/N</th>
                    <th class="col-desc">DESCRIPTION OF GOODS/JOBS</th>
                    <th class="col-amt">AMOUNT</th> 
                    <th class="col-del"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-sn">1</td>
                    <td class="col-desc"><input type="text" class="cell-input" placeholder="Item description"></td>
                    <td class="col-amt"><input type="number" class="cell-input amt-input" oninput="calculateTotal()" placeholder="0"></td>
                    <td class="col-del"><span class="delete-btn" onclick="deleteRow(this)">×</span></td>
                </tr>
            </tbody>
            
            <tfoot>
                <tr>
                    <td colspan="2" class="total-label">TOTAL ₦</td> 
                    
                    <td class="total-value"><span id="grandTotal">0</span></td>
                    
                    <td></td> 
                </tr>
            </tfoot>
        </table>

        <div class="footer-note">
            Goods sold in good condition are not returnable. <br>
            No refund of money after payment. Thanks.

            <div class="signature-line">Customer's Signature</div>
        </div>
    </div>

    <script>
        document.getElementById('invDate').valueAsDate = new Date();

        function addRow() {
            const tbody = document.getElementById("itemsTable").getElementsByTagName('tbody')[0];
            const rowCount = tbody.rows.length;
            const row = tbody.insertRow(rowCount);
            
            row.innerHTML = `
                <td class="col-sn">${rowCount + 1}</td>
                <td class="col-desc"><input type="text" class="cell-input"></td>
                <td class="col-amt"><input type="number" class="cell-input amt-input" oninput="calculateTotal()" placeholder="0"></td>
                <td class="col-del"><span class="delete-btn" onclick="deleteRow(this)">×</span></td>
            `;
        }

        function deleteRow(btn) {
            const row = btn.parentNode.parentNode;
            const tbody = row.parentNode;
            if(tbody.rows.length > 1) {
                tbody.removeChild(row);
                calculateTotal();
                reorderSN();
            }
        }

        function reorderSN() {
            const rows = document.getElementById("itemsTable").getElementsByTagName('tbody')[0].rows;
            for(let i=0; i<rows.length; i++) {
                rows[i].cells[0].innerHTML = i + 1;
            }
        }

        function calculateTotal() {
            let total = 0;
            const inputs = document.querySelectorAll('.amt-input');
            inputs.forEach(input => {
                const val = parseFloat(input.value);
                total += isNaN(val) ? 0 : val;
            });
            document.getElementById('grandTotal').innerText = total.toLocaleString();
        }

        function generatePDF() {
            const element = document.getElementById('invoice-card');
            const customerRaw = document.getElementById('customerName').value;
            const customer = customerRaw ? customerRaw.replace(/[^a-zA-Z0-9]/g, '_') : 'Customer';
            
            const deleteButtons = document.querySelectorAll('.col-del');
            deleteButtons.forEach(el => el.style.visibility = 'hidden');

            const opt = {
                margin: 0,
                filename: `Frankjay_Invoice_${customer}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                deleteButtons.forEach(el => el.style.visibility = 'visible');
            });
        }
    </script>
</body>
</html>
